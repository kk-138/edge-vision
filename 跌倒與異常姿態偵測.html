<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>跌倒與異常姿態偵測</title>
<link rel="stylesheet" href="./css/design-system.css" />
<style>
  * { box-sizing: border-box !important; }

  /* 頂部固定導覽列（置中與對齊） */
  .navbar-header {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 1280px;
    background-color: transparent;
    z-index: 2000;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }

  .nav-brand {
    font-size: 20px;
    color: #fff;
    font-weight: bold;
    text-decoration: none;
    letter-spacing: 0.05em;
  }

  /* 漢堡按鈕 */
  .hamburger-menu-wrapper { position: relative; z-index: 2010; }
  
  .hamburger-btn {
    background: #1a1a20;
    border: 1.5px solid #d4af37;
    width: 44px;
    height: 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .hamburger-btn:hover { background: #24242c; }
  
  .hamburger-btn span {
    display: block;
    width: 20px;
    height: 2px;
    background-color: #d4af37;
    transition: 0.3s;
  }

  .hamburger-menu-wrapper.open .hamburger-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger-menu-wrapper.open .hamburger-btn span:nth-child(2) { opacity: 0; }
  .hamburger-menu-wrapper.open .hamburger-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* 下拉選單 */
  .hamburger-dropdown {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    width: 220px;
    background: #16161a;
    border: 1.5px solid #d4af37;
    display: none;
    flex-direction: column;
    z-index: 2020;
    box-shadow: -4px 12px 32px rgba(0, 0, 0, 0.85);
  }

  .hamburger-menu-wrapper.open .hamburger-dropdown { display: flex; }

  .dropdown-item {
    position: relative;
    padding: 16px 20px;
    color: #f5f5f7;
    text-decoration: none;
    font-size: 16px;
    border-bottom: 1px solid #202027;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .dropdown-item:last-child { border-bottom: none; }

  .dropdown-item:hover {
    background: rgba(212, 175, 55, 0.12);
    color: #ebd07a;
  }

  /* 被選中頁面的樣式 (打勾) */
  .dropdown-item.active {
    background: rgba(212, 175, 55, 0.2);
    color: #ebd07a;
    font-weight: bold;
  }

  .dropdown-item.active::after {
    content: "✓";
    color: #d4af37;
    font-size: 16px;
    position: static;
    transform: none;
    margin: 0;
    box-shadow: none;
    border: none;
    background: transparent;
    padding: 0;
    visibility: visible;
    opacity: 1;
  }

  /* 選單提示框 (Tooltip：向左展開) */
  .dropdown-item[data-tooltip]::before {
    content: attr(data-tooltip);
    position: absolute;
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-right: 12px;
    background: #1a1a20;
    color: #ebd07a;
    padding: 8px 14px;
    border: 1px solid #997c22;
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, margin-right 0.2s ease;
    box-shadow: -4px 6px 16px rgba(0,0,0,0.6);
    z-index: 2030;
  }

  .dropdown-item[data-tooltip]:hover::before {
    opacity: 1;
    visibility: visible;
    margin-right: 16px;
  }

  /* ---- 強制重設與防止橫向溢出 ---- */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
    background-color: #0b0c10;
    color: #e0e0e0;
  }

  .app-shell {
    width: 100% !important;
    max-width: 1280px !important;
    margin: 0 auto !important;
    padding: 32px !important;
    padding-top: 110px !important;
  }

  /* 標頭與按鈕區塊排版 */
  .page-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  /* 返回監看金黃細框按鈕樣式 */
  .btn-gold-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: transparent;
    border: 1.5px solid #d4af37;
    color: #f1c40f;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 400;
    text-decoration: none;
    letter-spacing: 1px;
    transition: all 0.2s ease;
    border-radius: 0px;
    width: fit-content;
    margin-top: 4px;
  }
  .btn-gold-outline:hover {
    background: rgba(212, 175, 55, 0.12);
    border-color: #f39c12;
    color: #f39c12;
  }

  /* ---- RWD 核心佈局 (修正 min-width: 0 防撐破) ---- */
  .layout { 
    display: grid !important; 
    grid-template-columns: 1.3fr 1fr !important; 
    gap: 20px !important; 
    align-items: start !important;
    width: 100% !important;
  }

  .card {
    background: #141418 !important;
    border: 1px solid var(--color-border, #202027) !important;
    padding: 20px !important;
    min-width: 0 !important;
    width: 100% !important;
  }

  /* 攝影機滾動標籤 */
  .cam-tabs-container {
    display: flex !important;
    align-items: center;
    gap: 10px;
    overflow-x: auto !important;
    white-space: nowrap !important;
    padding: 6px 2px 14px 2px;
    margin: 8px 0 16px 0;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
    width: 100% !important;
    max-width: 100% !important;
  }

  .cam-tabs-container::-webkit-scrollbar { height: 4px; }
  .cam-tabs-container::-webkit-scrollbar-thumb { background: var(--color-border, #2c2c36); }

  .cam-tab-btn {
    flex: 0 0 auto !important;
    background: #1a1a20;
    border: 1.5px solid var(--color-border, #2c2c36);
    color: var(--color-text-muted, #9e9ea7);
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    border-radius: 0px;
    outline: none;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .cam-tab-btn:hover {
    color: #ffffff;
    border-color: var(--color-primary-light, #ebd07a);
  }

  .cam-tab-btn.active {
    background: #ffffff !important;
    color: #0d0d0f !important;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 18px;
    border: 2px solid var(--color-primary, #d4af37) !important;
    box-shadow: 4px 4px 0px var(--color-primary, #d4af37) !important;
  }

  /* 畫面預覽 */
  .cam-preview-box {
    width: 100% !important;
    aspect-ratio: 16/9;
    background: linear-gradient(160deg, #161c2d, #0d121c);
    border: 1px solid var(--color-border, #2c2c36);
    position: relative;
    overflow: hidden;
    margin: 12px 0 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cam-preview-box svg.silhouette {
    width: clamp(70px, 16vw, 120px);
    height: clamp(70px, 16vw, 120px);
    fill: #222d42;
  }

  .live-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(239, 68, 68, 0.85);
    color: #fff;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: bold;
  }

  /* 表單元件 */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
    min-width: 0;
  }

  .form-group label {
    font-size: 13px;
    color: var(--color-text-muted, #9e9ea7);
  }

  .underline-input {
    background: transparent !important;
    border: none !important;
    border-bottom: 2px solid var(--color-primary, #d4af37) !important;
    border-radius: 0 !important;
    color: #ffffff !important;
    font-size: 16px !important;
    padding: 8px 4px !important;
    width: 100% !important;
    outline: none !important;
    font-family: inherit;
    transition: border-color 0.25s ease;
  }

  .underline-input:focus {
    border-bottom-color: var(--color-primary-light, #ebd07a) !important;
    background: rgba(212, 175, 55, 0.05) !important;
  }

  .btn-danger-simulate {
    background: #ff4d4f;
    border: 1px solid #ff4d4f;
    color: #ffffff;
    font-weight: bold;
    padding: 14px;
    width: 100% !important;
    cursor: pointer;
    font-size: 15px;
    border-radius: 0px;
    min-height: 48px;
    transition: all 0.2s ease;
  }
  .btn-danger-simulate:hover {
    background: #ff7875;
    box-shadow: 0 0 14px rgba(255, 77, 79, 0.4);
  }

  /* 紀錄清單 */
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .history-header h3 {
    margin: 0;
    font-size: 1.1rem;
    color: #ffffff;
  }

  .btn-read-all {
    background: transparent;
    border: 1px solid var(--color-border, #2c2c36);
    color: var(--color-text-muted, #9e9ea7);
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .btn-read-all:hover {
    color: var(--color-primary-light, #ebd07a);
    border-color: var(--color-primary, #d4af37);
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 420px;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px;
    background: var(--color-bg-elevated, #1a1a20);
    border: 1px solid var(--color-border-soft, #202027);
    font-size: 13px;
  }

  .history-item.unread {
    border-left: 3px solid var(--alert-2-orange, #fa8c16);
    background: rgba(250, 140, 22, 0.05);
  }

  .badge-tag {
    font-size: 11px;
    padding: 4px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-tag.orange {
    background: rgba(250, 140, 22, 0.15);
    color: #fa8c16;
    border: 1px solid rgba(250, 140, 22, 0.3);
  }
  .badge-tag.muted {
    background: rgba(255, 255, 255, 0.05);
    color: #8c8c8c;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* 倒數彈窗 */
  .overlay {
    position: fixed; 
    inset: 0; 
    background: rgba(6, 8, 14, 0.94);
    backdrop-filter: blur(8px);
    display: none; 
    align-items: center; 
    justify-content: center;
    z-index: 10000; 
    padding: 16px;
  }
  .overlay.is-open { display: flex; }

  .alert-panel {
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--color-surface, #1a1a20);
    border: 1.5px solid var(--alert-2-orange, #fa8c16);
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 0 30px rgba(250, 140, 22, 0.25);
  }

  .ring-wrap { 
    position: relative; 
    width: 120px; 
    height: 120px; 
    margin: 14px auto; 
  }
  .ring-wrap svg { 
    transform: rotate(-90deg); 
    width: 100%;
    height: 100%;
  }
  .ring-track { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 8; }
  .ring-progress { 
    fill: none; 
    stroke: var(--alert-2-orange, #fa8c16); 
    stroke-width: 8; 
    stroke-linecap: round; 
    stroke-dasharray: 377;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }
  .ring-number {
    position: absolute; 
    inset: 0; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-size: 36px;
    font-weight: bold;
    color: var(--alert-2-orange, #fa8c16);
  }

  .btn-cancel-alert {
    background: var(--color-primary, #d4af37);
    border: 1px solid var(--color-primary, #d4af37);
    color: #0d0d0f;
    font-weight: bold;
    padding: 13px;
    width: 100%;
    cursor: pointer;
    font-size: 15px;
    min-height: 48px;
    transition: all 0.2s;
  }

  /* =========================================================
     強制覆蓋：行動端 / 平板斷點 (RWD Media Queries)
     ========================================================= */
  @media screen and (max-width: 860px) {
    .app-shell {
      padding: 16px 12px 40px !important;
      padding-top: 100px !important;
    }
    .layout { 
      grid-template-columns: 100% !important; 
      gap: 16px !important;
    }
    .card {
      padding: 16px !important;
    }
    .history-list {
      max-height: 280px !important;
    }
  }

  @media screen and (max-width: 480px) {
    .header-title h1 {
      font-size: 1.35rem !important;
    }
    .cam-tab-btn {
      padding: 7px 14px !important;
      font-size: 13px !important;
    }
    .cam-tab-btn.active {
      padding: 7px 16px !important;
      font-size: 13px !important;
      box-shadow: 3px 3px 0px var(--color-primary, #d4af37) !important;
    }
    .ring-wrap {
      width: 100px;
      height: 100px;
    }
    .ring-number {
      font-size: 30px;
    }
  }
</style>
</head>

<script>
  function toggleMenu() {
    document.getElementById('hamburgerMenu').classList.toggle('open');
  }

  document.addEventListener('click', function(e) {
    const menu = document.getElementById('hamburgerMenu');
    if (menu && !menu.contains(e.target)) {
      menu.classList.remove('open');
    }
  });

  let selectedCam = "浴室走道";
  const urlParams = new URLSearchParams(window.location.search);
  const initialCam = urlParams.get("cam");
  if (initialCam) {
    selectedCam = initialCam;
  }

  const tabBtns = document.querySelectorAll(".cam-tab-btn");
  tabBtns.forEach(btn => {
    if (btn.getAttribute("data-cam") === selectedCam) {
      tabBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    btn.addEventListener("click", () => {
      tabBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedCam = btn.getAttribute("data-cam");
    });
  });

  const defaultHistory = [
    { id: 1, time: "今天 14:22", cam: "浴室走道", status: "已確認無事", unread: true },
    { id: 2, time: "昨天 09:07", cam: "客廳", status: "長輩自行站起", unread: false },
    { id: 3, time: "3天前 21:40", cam: "主臥室", status: "已確認無事", unread: false }
  ];

  function getHistory() {
    return JSON.parse(localStorage.getItem("fall_detection_history") || JSON.stringify(defaultHistory));
  }

  function saveHistory(list) {
    localStorage.setItem("fall_detection_history", JSON.stringify(list));
  }

  function renderHistory() {
    const list = getHistory();
    const container = document.getElementById("historyList");
    container.innerHTML = "";

    list.forEach(item => {
      const div = document.createElement("div");
      div.className = `history-item ${item.unread ? 'unread' : ''}`;
      div.innerHTML = `
        <div style="flex:1; min-width: 0; padding-right: 8px;">
          <div style="color:#ffffff; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.cam} · 異常跌倒姿態</div>
          <div style="font-size:12px; color:var(--color-text-muted, #9e9ea7);">${item.time}</div>
        </div>
        <span class="badge-tag ${item.unread ? 'orange' : 'muted'}">${item.status}</span>
      `;
      container.appendChild(div);
    });
  }

  document.getElementById("readAllBtn").addEventListener("click", () => {
    const list = getHistory().map(item => ({ ...item, unread: false }));
    saveHistory(list);
    renderHistory();
  });

  const overlay = document.getElementById("overlay");
  const ringProgress = document.getElementById("ringProgress");
  const ringNumber = document.getElementById("ringNumber");
  const alertLocationTitle = document.getElementById("alertLocationTitle");

  let timer = null;
  const TOTAL_SECONDS = 15;
  const CIRCLE_LENGTH = 2 * Math.PI * 60; 
  let currentRemaining = TOTAL_SECONDS;

  ringProgress.style.strokeDasharray = CIRCLE_LENGTH;

  function startCountdown() {
    currentRemaining = TOTAL_SECONDS;
    ringNumber.textContent = currentRemaining;
    ringProgress.style.strokeDashoffset = 0;

    clearInterval(timer);
    timer = setInterval(() => {
      currentRemaining--;
      ringNumber.textContent = currentRemaining;

      const offset = CIRCLE_LENGTH * (1 - (currentRemaining / TOTAL_SECONDS));
      ringProgress.style.strokeDashoffset = offset;

      if (currentRemaining <= 0) {
        clearInterval(timer);
        const list = getHistory();
        list.unshift({
          id: Date.now(),
          time: "剛剛",
          cam: selectedCam,
          status: "倒數結束自動撥號",
          unread: true
        });
        saveHistory(list);
        window.location.href = `緊急聯繫與雙向語音.html?auto=1&cam=${encodeURIComponent(selectedCam)}`;
      }
    }, 1000);
  }

  document.getElementById("simulateBtn").addEventListener("click", () => {
    alertLocationTitle.textContent = `${selectedCam} · 偵測到跌倒`;
    overlay.classList.add("is-open");
    startCountdown();
  });

  document.getElementById("cancelBtn").addEventListener("click", () => {
    clearInterval(timer);
    overlay.classList.remove("is-open");

    const list = getHistory();
    list.unshift({
      id: Date.now(),
      time: "剛剛",
      cam: selectedCam,
      status: "手動確認取消",
      unread: true
    });
    saveHistory(list);
    renderHistory();
  });

  renderHistory();
</script>
</body>
</html>
