<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>照顧者通知中心</title>
<link rel="stylesheet" href="./css/design-system.css" />
<style>
  * { box-sizing: border-box; }

  /* 頂部固定導覽列（置中與對齊） */
  .navbar-header {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 1280px;
    background-color: transparent;
    z-index: 2000;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }

  .nav-brand {
    font-size: 20px;
    color: #fff;
    font-weight: bold;
    text-decoration: none;
    letter-spacing: 0.05em;
  }

  /* 漢堡按鈕 */
  .hamburger-menu-wrapper { position: relative; z-index: 2010; }
  
  .hamburger-btn {
    background: #1a1a20;
    border: 1.5px solid #d4af37;
    width: 44px;
    height: 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .hamburger-btn:hover { background: #24242c; }
  
  .hamburger-btn span {
    display: block;
    width: 20px;
    height: 2px;
    background-color: #d4af37;
    transition: 0.3s;
  }

  .hamburger-menu-wrapper.open .hamburger-btn span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger-menu-wrapper.open .hamburger-btn span:nth-child(2) { opacity: 0; }
  .hamburger-menu-wrapper.open .hamburger-btn span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* 下拉選單 */
  .hamburger-dropdown {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    width: 220px;
    background: #16161a;
    border: 1.5px solid #d4af37;
    display: none;
    flex-direction: column;
    z-index: 2020;
    box-shadow: -4px 12px 32px rgba(0, 0, 0, 0.85);
  }

  .hamburger-menu-wrapper.open .hamburger-dropdown { display: flex; }

  .dropdown-item {
    position: relative;
    padding: 16px 20px;
    color: #f5f5f7;
    text-decoration: none;
    font-size: 16px;
    border-bottom: 1px solid #202027;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .dropdown-item:last-child { border-bottom: none; }

  .dropdown-item:hover {
    background: rgba(212, 175, 55, 0.12);
    color: #ebd07a;
  }

  /* 被選中頁面的樣式 (打勾) */
  .dropdown-item.active {
    background: rgba(212, 175, 55, 0.2);
    color: #ebd07a;
    font-weight: bold;
  }

  .dropdown-item.active::after {
    content: "✓";
    color: #d4af37;
    font-size: 16px;
    position: static;
    transform: none;
    margin: 0;
    box-shadow: none;
    border: none;
    background: transparent;
    padding: 0;
    visibility: visible;
    opacity: 1;
  }

  /* 選單提示框 (Tooltip：向左展開) */
  .dropdown-item[data-tooltip]::before {
    content: attr(data-tooltip);
    position: absolute;
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-right: 12px;
    background: #1a1a20;
    color: #ebd07a;
    padding: 8px 14px;
    border: 1px solid #997c22;
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, margin-right 0.2s ease;
    box-shadow: -4px 6px 16px rgba(0,0,0,0.6);
    z-index: 2030;
  }

  .dropdown-item[data-tooltip]:hover::before {
    opacity: 1;
    visibility: visible;
    margin-right: 16px;
  }

  body {
    background-color: #0b0c10 !important;
    color: #e0e0e0;
  }

  .app-shell {
    max-width: 1280px !important;
    margin: 0 auto !important;
    padding: 32px !important;
    padding-top: 110px !important;
  }

  .page-head {
    margin-bottom: 24px;
  }
  .page-head h1 {
    font-size: 28px;
    color: #ffffff;
    margin: 0 0 8px 0;
  }
  .page-head p {
    font-size: 14px;
    color: #8e929d;
    margin: 0;
  }

  /* 頂部操作與篩選列 */
  .filter-bar-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }

  .filters {
    display: flex !important;
    gap: 12px !important;
    flex-wrap: wrap !important;
  }

  /* 符合大小的長方形篩選按鈕 */
  .filter-chip {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: auto !important;
    height: auto !important;
    padding: 8px 18px !important;
    font-size: 14px !important;
    line-height: 1.4 !important;
    font-weight: 400 !important;
    letter-spacing: 0.5px !important;
    white-space: nowrap !important;
    color: #8e929d !important;
    background: #14161d !important;
    border: 1.5px solid #2d3240 !important;
    border-radius: 0px !important;
    cursor: pointer !important;
    user-select: none !important;
    transition: all 0.2s ease !important;
    box-shadow: none !important;
  }

  .filter-chip:hover {
    color: #ffffff !important;
    background: #1a1e28 !important;
    border-color: #4a5568 !important;
  }

  /* 選中狀態 */
  .filter-chip.active {
    background: rgba(212, 175, 55, 0.1) !important;
    border-color: #d4af37 !important;
    color: #f1c40f !important;            
  }

  .filter-chip[data-level="1"].active {
    background: rgba(250, 173, 20, 0.1) !important;
    border-color: var(--alert-1-yellow, #faad14) !important;
    color: var(--alert-1-yellow, #faad14) !important;
  }

  .filter-chip[data-level="2"].active {
    background: rgba(249, 115, 22, 0.1) !important;
    border-color: var(--alert-2-orange, #f97316) !important;
    color: var(--alert-2-orange, #f97316) !important;
  }

  .filter-chip[data-level="3"].active {
    background: rgba(239, 68, 68, 0.1) !important;
    border-color: var(--alert-3-red, #ef4444) !important;
    color: var(--alert-3-red, #ef4444) !important;
  }

  /* 全部標記已讀按鈕 */
  .btn-gold-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1.5px solid #d4af37 !important;
    color: #f1c40f !important;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 400;
    text-decoration: none;
    border-radius: 0px !important;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: none !important;
  }
  .btn-gold-outline:hover {
    background: rgba(212, 175, 55, 0.15) !important;
    border-color: #f39c12 !important;
    color: #f39c12 !important;
  }

  /* 卡片與通知列表 */
  .card {
    background: #14161d !important;
    border: 1px solid #232630 !important;
    border-radius: 12px !important;
    padding: 8px 16px !important;
    box-shadow: none !important;
  }

  .notif-item {
    display: grid;
    grid-template-columns: 4px 56px 1fr auto auto;
    gap: 16px;
    align-items: center;
    padding: 16px 10px;
    border-bottom: 1px solid #202027;
    transition: opacity 0.3s ease, background 0.2s ease;
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.is-read {
    opacity: 0.45;
  }
  
  .notif-item__bar { align-self: stretch; border-radius: 2px; }
  .notif-item__bar.l1 { background: var(--alert-1-yellow, #faad14); }
  .notif-item__bar.l2 { background: var(--alert-2-orange, #f97316); }
  .notif-item__bar.l3 { background: var(--alert-3-red, #ef4444); }
  
  .notif-item__thumb {
    width: 56px; 
    height: 40px; 
    border-radius: 6px;
    background: linear-gradient(160deg, #1c202a, #101217);
    border: 1px solid #232630;
  }
  
  .notif-item__title { 
    font-size: 14px; 
    font-weight: 500;
    color: #ffffff;
    margin-bottom: 4px; 
    text-decoration: none;
    display: block;
  }
  .notif-item__meta { 
    font-size: 12px; 
    color: #8e929d; 
  }
  .notif-item__status { 
    font-size: 13px; 
    font-weight: 500;
    margin-right: 6px;
  }

  /* 單項已讀按鈕 */
  .btn-read-toggle {
    background: transparent;
    border: 1px solid #d4af37;
    color: #f1c40f;
    font-size: 12px;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 0px;
    transition: all 0.2s ease;
    white-space: nowrap;
    box-shadow: none !important;
  }
  .btn-read-toggle:hover {
    background: rgba(212, 175, 55, 0.15);
    border-color: #f39c12;
    color: #f39c12;
  }
  .notif-item.is-read .btn-read-toggle {
    border-color: #4a5568;
    color: #8e929d;
    background: transparent;
  }
</style>
</head>
<body data-nav-active="12">

<!-- 頂部導覽列 -->
<header class="navbar-header">
  <a href="index.html?view=caregiver" class="nav-brand">Edge-Vision</a>
  
  <div class="hamburger-menu-wrapper" id="hamburgerMenu">
    <button class="hamburger-btn" onclick="toggleMenu()" aria-label="選單">
      <span></span><span></span><span></span>
    </button>

    <div class="hamburger-dropdown">
      <a href="index.html?view=caregiver" class="dropdown-item" data-tooltip="返回九宮格即時監看畫面">即時監看</a>
      <a href="危險區域入侵越界警報.html" class="dropdown-item" data-tooltip="框選危險區域，一旦越界即觸發警報">越界警報</a>
      <a href="跌倒與異常姿態偵測.html" class="dropdown-item" data-tooltip="偵測跌倒後觸發警報流程">姿態偵測</a>
      <a href="長時間靜止偵測.html" class="dropdown-item" data-tooltip="App 內閃爍與推播">靜止警報</a>
      <a href="隱私模式開關.html" class="dropdown-item" data-tooltip="暫時遮蔽鏡頭保護私密時刻">隱私模式</a>
      <a href="離床與夜間活動監測.html" class="dropdown-item" data-tooltip="夜間離床時間軸與深夜開門警報">夜間監測</a>
      <a href="三階段警報.html" class="dropdown-item" data-tooltip="黃／橙／紅與 30 秒倒數">三級警報</a>
      <a href="緊急聯繫與雙向語音.html" class="dropdown-item" data-tooltip="自動撥號、LINE/SMS 通知、語音通話">緊急語音</a>
      <a href="照顧者App與通知.html" class="dropdown-item active" data-tooltip="彙整歷史紀錄">通知中心</a>
      <a href="index.html" class="dropdown-item" data-tooltip="重新挑選照顧者或長輩身分">返回身分選擇</a>
    </div>
  </div>
</header>

<div class="app-shell">
  <div class="page-head">
    <div>
      <h1>警報歷史紀錄</h1>
      <p>彙整所有偵測功能觸發的一/二/三級警報事件。</p>
    </div>
  </div>

  <!-- 長方形篩選按鈕與全部已讀按鈕 -->
  <div class="filter-bar-wrapper">
    <div class="filters" id="filters">
      <div class="filter-chip active" data-level="all">全部</div>
      <div class="filter-chip" data-level="1">一級警報</div>
      <div class="filter-chip" data-level="2">二級警報</div>
      <div class="filter-chip" data-level="3">三級警報</div>
    </div>

    <button class="btn-gold-outline" id="markAllReadBtn">
      全部標記已讀
    </button>
  </div>

  <!-- 通知清單容器 -->
  <div class="card" id="notifList"></div>
</div>

<script src="js/shared.js"></script>
<script>
  function toggleMenu() {
    document.getElementById('hamburgerMenu').classList.toggle('open');
  }

  document.addEventListener('click', function(e) {
    const menu = document.getElementById('hamburgerMenu');
    if (menu && !menu.contains(e.target)) {
      menu.classList.remove('open');
    }
  });

  const NOTIFS = [
    { id: "n1", level: 3, title: "跌倒事件 → 自動撥打陳美玲", meta: "浴室走道 · 今天 03:12", status: "已接通", isRead: false },
    { id: "n2", level: 2, title: "深夜開門事件", meta: "大門玄關 · 今天 03:05", status: "已取消警報", isRead: false },
    { id: "n3", level: 1, title: "異常滯留提醒", meta: "浴室 · 今天 14:22", status: "已確認", isRead: false },
    { id: "n4", level: 2, title: "偵測到跌倒姿態", meta: "客廳 · 昨天 09:07", status: "已標記誤報", isRead: false },
    { id: "n5", level: 1, title: "異常滯留提醒", meta: "客廳沙發 · 昨天 16:40", status: "已確認", isRead: false },
    { id: "n6", level: 2, title: "危險區域越界（樓梯口）", meta: "樓梯口 · 3天前 21:12", status: "已取消警報", isRead: false },
  ];

  let currentFilter = "all";

  function statusColor(level) {
    return level === 3 ? "var(--alert-3-red, #ef4444)" : level === 2 ? "var(--alert-2-orange, #f97316)" : "var(--alert-1-yellow, #faad14)";
  }

  function render(filter) {
    currentFilter = filter;
    const list = document.getElementById("notifList");
    list.innerHTML = "";
    
    const filtered = NOTIFS.filter((n) => filter === "all" || n.level === Number(filter));

    filtered.forEach((n) => {
      const item = document.createElement("div");
      item.className = `notif-item ${n.isRead ? "is-read" : ""}`;
      item.dataset.id = n.id;
      item.innerHTML = `
        <div class="notif-item__bar l${n.level}"></div>
        <div class="notif-item__thumb"></div>
        <div>
          <div class="notif-item__title">${n.title}</div>
          <div class="notif-item__meta">${n.meta}</div>
        </div>
        <div class="notif-item__status" style="color:${statusColor(n.level)}">${n.status}</div>
        <button class="btn-read-toggle" onclick="toggleRead('${n.id}')">
          ${n.isRead ? "已讀取" : "標記已讀"}
        </button>
      `;
      list.appendChild(item);
    });

    if (filtered.length === 0) {
      list.innerHTML = '<p style="padding:24px; color:#8e929d; text-align:center; margin:0;">此篩選條件下沒有紀錄</p>';
    }
  }

  // 單項已讀切換
  window.toggleRead = function(id) {
    const item = NOTIFS.find(n => n.id === id);
    if (item) {
      item.isRead = !item.isRead;
      render(currentFilter);
    }
  };

  // 全部標記已讀
  document.getElementById("markAllReadBtn").addEventListener("click", () => {
    NOTIFS.forEach(n => n.isRead = true);
    render(currentFilter);
  });

  // 篩選切換
  document.getElementById("filters").addEventListener("click", (e) => {
    const chip = e.target.closest(".filter-chip");
    if (!chip) return;
    document.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    render(chip.dataset.level);
  });

  render("all");
</script>
</body>
</html>
