<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>危險區域越界警報</title>
<link rel="stylesheet" href="./css/design-system.css" />

<style>
  .back-btn-container { margin: 20px 0 36px 0; }

  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(26, 26, 32, 0.85);
    border: 1.5px solid var(--color-primary, #d4af37);
    color: var(--color-primary-light, #ebd07a);
    padding: 9px 20px;
    font-size: 14px;
    text-decoration: none;
    border-radius: 0px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    transition: all 0.25s ease;
  }

  .btn-back:hover {
    background: rgba(212, 175, 55, 0.18);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: none !important;
  }

  .layout { 
    display: grid;
    grid-template-columns: 1.6fr 1fr; 
    gap: 24px;
    align-items: start; 
  }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .stage {
    aspect-ratio: 16/10;
    position: relative;
    background: linear-gradient(160deg, #161c2d, #0d121c);
    border-radius: 0px;
    border: 1px solid var(--color-border);
    overflow: hidden;
    cursor: crosshair;
    margin-top: 14px;
  }
  .stage svg { 
    position: absolute; 
    inset: 0; 
    width: 100%; 
    height: 100%; 
    pointer-events: none;
  }
  .stage__hint {
    position: absolute; top: 12px; left: 12px;
    font-size: 12px; color: var(--color-text-muted);
    background: rgba(0,0,0,0.75); padding: 6px 12px; 
    border-radius: 0px; border: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
    z-index: 5;
  }

  .setting-form {
    display: flex;
    flex-direction: column;
    gap: 22px;
    margin-top: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 13px;
    color: var(--color-text-muted, #9e9ea7);
    letter-spacing: 0.05em;
  }

  .underline-input, .underline-select {
    background: transparent !important;
    border: none !important;
    border-bottom: 2px solid var(--color-primary, #d4af37) !important;
    border-radius: 0 !important;
    color: #ffffff !important;
    font-size: 15px !important;
    padding: 8px 4px !important;
    width: 100% !important;
    outline: none !important;
    box-shadow: none !important;
    font-family: inherit;
    transition: border-color 0.25s ease;
  }

  .underline-input:focus, .underline-select:focus {
    border-bottom-color: var(--color-primary-light, #ebd07a) !important;
    background: rgba(212, 175, 55, 0.05) !important;
  }

  .underline-select option { background: #1a1a20; color: #ffffff; padding: 10px; }

  .btn-action-ghost {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--color-border);
    color: var(--color-text);
    padding: 8px 18px;
    border-radius: 0px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-action-ghost:hover { background: rgba(255, 255, 255, 0.12); }

  .btn-action-primary {
    background: var(--color-primary, #d4af37);
    border: 1px solid var(--color-primary);
    color: #0d0d0f;
    font-weight: bold;
    padding: 8px 18px;
    border-radius: 0px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-action-primary:hover { background: var(--color-primary-light, #ebd07a); }

  .zone-list-item {
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    padding: 12px 14px; 
    border-radius: 0px;
    background: var(--color-bg-elevated, #16161a);
    border: 1px solid var(--color-border-soft, #202027);
    margin-bottom: 10px;
    transition: all 0.2s ease;
  }

  .zone-list-item.selected-editing {
    border-color: var(--color-primary, #d4af37);
    background: rgba(212, 175, 55, 0.1);
  }

  .zone-swatch { width: 10px; height: 10px; display: inline-block; }
  .badge-tag { font-size: 12px; padding: 3px 8px; }
  .badge-tag.orange {
    background: var(--alert-2-orange-bg, rgba(250, 140, 22, 0.14));
    color: var(--alert-2-orange, #fa8c16);
    border: 1px solid rgba(250, 140, 22, 0.3);
  }
  .badge-tag.yellow {
    background: var(--alert-1-yellow-bg, rgba(250, 173, 20, 0.12));
    color: var(--alert-1-yellow, #faad14);
    border: 1px solid rgba(250, 173, 20, 0.3);
  }

  .zone-actions { display: flex; align-items: center; gap: 8px; }
  .btn-icon-action {
    background: transparent;
    border: 1px solid transparent;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-icon-action.delete { color: #ff7875; border-color: rgba(255,77,79,0.3); }
</style>
</head>
<body data-nav-active="04">
<div id="topnav-mount"></div>

<div class="app-shell">
  <div>
    <h1>危險區域越界警報</h1>
    <p>在畫面上點擊描出危險區域頂點，長輩進入該區域即觸發警報。</p>
  </div>

  <div class="back-btn-container">
    <a class="btn-back" href="即時影像.html">
      <span>←</span> 回到監看
    </a>
  </div>

  <div class="grid layout">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="currentCamTitle"></h3>
        <span id="editingNotice" style="display:none; font-size:12px; color:var(--color-primary-light); background:rgba(212,175,55,0.15); padding:3px 8px; border:1px solid var(--color-primary);">已載入上次設定 (編輯中)</span>
      </div>
      

      <div class="stage" id="stage">
        <svg id="stageSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      </div>

      <div class="row" style="margin-top:16px; justify-content: flex-end; gap: 12px;">
        <button class="btn-action-ghost" id="newZoneBtn" type="button">+ 重新繪製</button>
        <button class="btn-action-primary" id="saveBtn" type="button">儲存修改</button>
      </div>
    </div>

    <div class="stack" style="gap: 20px;">
      <div class="card">
        <h3 style="margin-bottom: 8px;">區域設定</h3>
        <div class="setting-form">
          <div class="form-group">
            <label for="zoneName">區域名稱</label>
            <input type="text" id="zoneName" class="underline-input" value="危險區域" />
          </div>
          <div class="form-group">
            <label for="zoneTime">生效時段</label>
            <select id="zoneTime" class="underline-select">
              <option value="僅夜間 22:00–06:00" selected>僅夜間 22:00–06:00</option>
              <option value="全天生效">全天生效</option>
              <option value="自訂時段">自訂時段</option>
            </select>
          </div>
          <div class="form-group">
            <label for="zoneLevel">觸發警報等級</label>
            <select id="zoneLevel" class="underline-select">
              <option value="2" selected>二級警報（30秒倒數）</option>
              <option value="1">一級提示</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 14px;">此攝影機已設定的區域</h3>
        <div id="zoneList"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const currentCam = urlParams.get("cam") || "樓梯口";
  document.getElementById("currentCamTitle").textContent = `${currentCam}`;

  const stage = document.getElementById("stage");
  const svg = document.getElementById("stageSvg");
  const zoneListContainer = document.getElementById("zoneList");
  const editingNotice = document.getElementById("editingNotice");
  const saveBtn = document.getElementById("saveBtn");
  const newZoneBtn = document.getElementById("newZoneBtn");
  const stageHint = document.getElementById("stageHint");

  let pointsPercent = [];

  function getCameraZone() {
    const all = JSON.parse(localStorage.getItem("edge_vision_zones") || "{}");
    const list = all[currentCam];
    if (list && Array.isArray(list) && list.length > 0) {
      return list[list.length - 1];
    }
    return null;
  }

  function saveCameraZone(zoneData) {
    const all = JSON.parse(localStorage.getItem("edge_vision_zones") || "{}");
    if (zoneData) {
      all[currentCam] = [zoneData];
    } else {
      delete all[currentCam];
    }
    localStorage.setItem("edge_vision_zones", JSON.stringify(all));
  }

  function renderSvg() {
    svg.innerHTML = "";
    if (pointsPercent.length === 0) return;

    const isOrange = document.getElementById("zoneLevel").value === "2";
    const color = isOrange ? "#fa8c16" : "#faad14";
    const fillColor = isOrange ? "rgba(250,140,22,0.35)" : "rgba(250,173,20,0.35)";

    pointsPercent.forEach((p) => {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", p.x);
      c.setAttribute("cy", p.y);
      c.setAttribute("r", 2);
      c.setAttribute("fill", color);
      svg.appendChild(c);
    });

    if (pointsPercent.length > 1) {
      const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      const pts = pointsPercent.map(p => `${p.x},${p.y}`).join(" ");
      poly.setAttribute("points", pts);
      poly.setAttribute("fill", fillColor);
      poly.setAttribute("stroke", color);
      poly.setAttribute("stroke-width", "0.8");
      svg.appendChild(poly);
    }
  }

  function renderZoneList() {
    const zone = getCameraZone();
    zoneListContainer.innerHTML = "";
    if (!zone || !zone.pointsPercent || zone.pointsPercent.length < 3) {
      zoneListContainer.innerHTML = `<div class="muted" style="text-align:center; padding:16px;">此位置尚未設定任何危險區域</div>`;
      return;
    }

    const isOrange = zone.level === "2";
    const colorStyle = isOrange ? "var(--alert-2-orange, #fa8c16)" : "var(--alert-1-yellow, #faad14)";
    const badgeClass = isOrange ? "orange" : "yellow";

    const item = document.createElement("div");
    item.className = "zone-list-item selected-editing";
    item.innerHTML = `
      <div class="row">
        <span class="zone-swatch" style="background:${colorStyle}"></span>
        <span>${zone.name}</span>
      </div>
      <div class="zone-actions">
        <span class="badge-tag ${badgeClass}">${zone.time && zone.time.includes("夜間") ? "夜間生效" : "全天生效"}</span>
        <button class="btn-icon-action delete" onclick="handleDeleteZone()">刪除</button>
      </div>
    `;
    zoneListContainer.appendChild(item);
  }

  stage.addEventListener("click", (e) => {
    const rect = stage.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * 100;
    const py = ((e.clientY - rect.top) / rect.height) * 100;
    pointsPercent.push({ x: Number(px.toFixed(2)), y: Number(py.toFixed(2)) });
    renderSvg();
  });

  newZoneBtn.addEventListener("click", () => {
    pointsPercent = [];
    renderSvg();
    if (stageHint) stageHint.textContent = "已清空畫布，請點擊畫面新增頂點（至少 3 點）";
  });

  saveBtn.addEventListener("click", () => {
    if (pointsPercent.length < 3) {
      alert("請至少在畫面上點擊 3 個頂點框出區域");
      return;
    }

    const name = document.getElementById("zoneName").value.trim() || `${currentCam}危險區`;
    const time = document.getElementById("zoneTime").value;
    const level = document.getElementById("zoneLevel").value;

    const zoneData = {
      id: "zone-" + Date.now(),
      name,
      time,
      level,
      pointsPercent: [...pointsPercent]
    };

    saveCameraZone(zoneData);
    renderZoneList();
    editingNotice.style.display = "inline-block";
    editingNotice.textContent = "已儲存最新設定";
    saveBtn.textContent = "儲存修改";
    alert(`「${name}」設定已更新！`);
  });

  window.handleDeleteZone = function() {
    if (confirm(`確定要刪除此設定嗎？`)) {
      saveCameraZone(null);
      pointsPercent = [];
      editingNotice.style.display = "none";
      saveBtn.textContent = "儲存區域";
      document.getElementById("zoneName").value = `${currentCam}危險區`;
      renderSvg();
      renderZoneList();
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    const saved = getCameraZone();
    if (saved && saved.pointsPercent && saved.pointsPercent.length >= 3) {
      document.getElementById("zoneName").value = saved.name || `${currentCam}危險區`;
      if (saved.time) document.getElementById("zoneTime").value = saved.time;
      if (saved.level) document.getElementById("zoneLevel").value = saved.level;
      pointsPercent = JSON.parse(JSON.stringify(saved.pointsPercent));
      editingNotice.style.display = "inline-block";
      saveBtn.textContent = "儲存修改";
      renderSvg();
    } else {
      document.getElementById("zoneName").value = `${currentCam}危險區`;
      saveBtn.textContent = "儲存區域";
    }
    renderZoneList();
  });
</script>
</body>
</html>
