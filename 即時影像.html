<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>即時影像</title>
<link rel="stylesheet" href="./css/design-system.css" />
<style>
  body {
    background-color: #0b0c10 !important;
    color: #e0e0e0;
  }

  .page-container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .breadcrumb {
    font-size: 13px;
    color: #8e929d;
    margin-bottom: 8px;
  }

  .page-title {
    font-size: 32px;
    font-weight: bold;
    color: #ffffff;
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }

  .page-desc {
    font-size: 14px;
    color: #8e929d;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .status-pill-group {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
  }

  .status-pill.online {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .status-pill.offline {
    background: rgba(255, 255, 255, 0.06);
    color: #94a3b8;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .dot-online {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #10b981;
    box-shadow: 0 0 8px #10b981;
  }

  .camera-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    position: relative;
    z-index: 10;
  }

  @media (max-width: 900px) { .camera-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .camera-grid { grid-template-columns: 1fr; } }

  .cam-card {
    background: #14161d;
    border: 1.5px solid #232630;
    border-radius: 12px;
    position: relative;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s ease, border-color 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cam-card:hover {
    transform: translateY(-4px);
    border-color: #d4af37;
  }

  .cam-card.status-active { border-color: #38bdf8; }
  .cam-card.status-yellow { border-color: #f59e0b; }
  .cam-card.status-orange { border-color: #f97316; }

  /* 客廳相機串流影片樣式 */
  .cam-card-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 1;
    background: #000;
  }
  .cam-card.is-streaming .cam-card-video {
    display: block;
  }
  .cam-card.is-streaming .avatar-silhouette {
    display: none;
  }

  .cam-header {
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
  }

  .cam-name {
    font-size: 15px;
    font-weight: 500;
    color: #f8fafc;
    background: rgba(11, 12, 16, 0.6);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .rec-dot {
    width: 6px;
    height: 6px;
    background-color: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 6px #ef4444;
  }

  .avatar-silhouette {
    width: 110px;
    height: 110px;
    fill: #222d42;
    z-index: 1;
  }

  .cam-card-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .cam-footer {
    position: absolute;
    bottom: 14px;
    left: 14px;
    z-index: 5;
  }

  .cam-status-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(11, 12, 16, 0.7);
  }

  .cam-status-tag.safe { background: rgba(16, 185, 129, 0.18); color: #34d399; }
  .cam-status-tag.yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
  .cam-status-tag.orange { background: rgba(249, 115, 22, 0.2); color: #fb923c; }

  .cam-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 14, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
  }

  .cam-modal-backdrop.open { display: flex; }

  .cam-modal-window {
    background: #14161d;
    border: 1.5px solid #d4af37;
    width: 100%;
    max-width: 860px;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: none;
  }

  .modal-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: #1a1e28;
    border-bottom: 1px solid #232630;
  }

  .modal-title {
    font-size: 18px;
    color: #ffffff;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-close-btn {
    background: transparent;
    border: 1px solid #d4af37;
    color: #f1c40f;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    border-radius: 0px;
  }
  .modal-close-btn:hover {
    background: rgba(212, 175, 55, 0.2);
    color: #ffffff;
  }

  .modal-view-area {
    position: relative;
    background: #06070a;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .modal-view-area video.modal-video-stream {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 1;
  }

  .modal-view-area.is-streaming video.modal-video-stream {
    display: block;
  }
  .modal-view-area.is-streaming svg.silhouette {
    display: none;
  }

  .modal-view-area svg.silhouette {
    width: 180px;
    height: 180px;
    fill: #1e293b;
  }

  .modal-view-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  .modal-live-tag {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(239, 68, 68, 0.85);
    color: #ffffff;
    padding: 4px 10px;
    border-radius: 0px;
    font-size: 12px;
    font-weight: bold;
    z-index: 4;
  }

  .modal-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: #14161d;
    border-top: 1px solid #232630;
    flex-wrap: wrap;
    gap: 10px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .modal-action-btn {
    background: transparent;
    border: 1.5px solid #2d3240;
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 0px !important;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .modal-action-btn:hover {
    border-color: #4a5568;
    background: #1a1e28;
  }

  .modal-action-btn.gold-btn {
    border: 1.5px solid #d4af37 !important;
    color: #f1c40f !important;
  }

  .modal-action-btn.gold-btn:hover {
    background: rgba(212, 175, 55, 0.15) !important;
    color: #f39c12 !important;
  }
</style>
</head>
<body data-nav-active="1">

<div id="topnav-mount"></div>

<div class="page-container">
  <div class="breadcrumb">照顧者端 · 首頁</div>
  <h1 class="page-title">即時九宮格監看</h1>
  <p class="page-desc">點擊任一畫面可放大檢視，客廳畫面已直接連線電腦鏡頭即時串流。</p>

  <div class="status-pill-group">
    <div class="status-pill online"><span class="dot-online"></span>8 台在線</div>
    <div class="status-pill offline">1 台離線</div>
  </div>

  <div class="camera-grid" id="cameraGrid">
    <div class="cam-card" id="livingCard" data-name="客廳" data-status="正常 (即時鏡頭串流中)">
      <div class="cam-header"><span class="cam-name">客廳</span><span class="rec-dot"></span></div>
      <video class="cam-card-video" id="livingCardVideo" autoplay playsinline muted></video>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag safe"><span class="dot-online"></span>即時串流</span></div>
    </div>

    <div class="cam-card" data-name="餐廳" data-status="正常">
      <div class="cam-header"><span class="cam-name">餐廳</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag safe"><span class="dot-online"></span>正常</span></div>
    </div>

    <div class="cam-card status-yellow" data-name="廚房" data-status="黃色提示 (瓦斯爐旁停留)">
      <div class="cam-header"><span class="cam-name">廚房</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag yellow">黃色提示</span></div>
    </div>

    <div class="cam-card" data-name="主臥室" data-status="正常">
      <div class="cam-header"><span class="cam-name">主臥室</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag safe"><span class="dot-online"></span>正常</span></div>
    </div>

    <div class="cam-card" data-name="浴室走道" data-status="正常">
      <div class="cam-header"><span class="cam-name">浴室走道</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag safe"><span class="dot-online"></span>正常</span></div>
    </div>

    <div class="cam-card status-orange" data-name="樓梯口" data-status="橙色警報 (區域越界)">
      <div class="cam-header"><span class="cam-name">樓梯口</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag orange">橙色警報</span></div>
    </div>

    <div class="cam-card" data-name="書房" data-status="正常">
      <div class="cam-header"><span class="cam-name">書房</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag safe"><span class="dot-online"></span>正常</span></div>
    </div>

    <div class="cam-card" data-name="陽台" data-status="正常">
      <div class="cam-header"><span class="cam-name">陽台</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag safe"><span class="dot-online"></span>正常</span></div>
    </div>

    <div class="cam-card" data-name="大門玄關" data-status="正常">
      <div class="cam-header"><span class="cam-name">大門玄關</span><span class="rec-dot"></span></div>
      <svg class="avatar-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="cam-card-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="cam-footer"><span class="cam-status-tag safe"><span class="dot-online"></span>正常</span></div>
    </div>
  </div>
</div>

<!-- 放大檢視彈窗 -->
<div class="cam-modal-backdrop" id="camModal">
  <div class="cam-modal-window">
    <div class="modal-topbar">
      <div class="modal-title"><span class="dot-online"></span><span id="modalCamName">攝影機</span></div>
      <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-view-area" id="modalViewArea">
      <span class="modal-live-tag">● LIVE</span>
      <video class="modal-video-stream" id="modalVideoStream" autoplay playsinline muted></video>
      <svg class="silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <svg class="modal-view-svg" id="modalSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
    <div class="modal-controls">
      <div id="modalCamStatus" style="font-size:14px; color:#8e929d;">狀態：正常</div>
      <div class="modal-actions">
        <button class="modal-action-btn gold-btn" id="btnToggleCamFeed">📷 開啟/關閉鏡頭</button>
        <button class="modal-action-btn gold-btn" id="btnGoToConfig">設定危險區域</button>
        <button class="modal-action-btn" onclick="window.location.href='緊急聯繫與雙向語音.html'">雙向對話</button>
      </div>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
  // ========== 相機串流管理 ==========
  let globalCamStream = null;
  const livingCard = document.getElementById("livingCard");
  const livingCardVideo = document.getElementById("livingCardVideo");
  const modalVideoStream = document.getElementById("modalVideoStream");
  const modalViewArea = document.getElementById("modalViewArea");
  const btnToggleCamFeed = document.getElementById("btnToggleCamFeed");

  async function startLivingCamera() {
    if (globalCamStream) return;
    try {
      globalCamStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      livingCardVideo.srcObject = globalCamStream;
      livingCard.classList.add("is-streaming");
      
      if (currentSelectedCam === "客廳") {
        modalVideoStream.srcObject = globalCamStream;
        modalViewArea.classList.add("is-streaming");
      }
    } catch (err) {
      console.warn("無法取得相機權限:", err);
    }
  }

  function stopLivingCamera() {
    if (globalCamStream) {
      globalCamStream.getTracks().forEach(track => track.stop());
      globalCamStream = null;
      livingCardVideo.srcObject = null;
      modalVideoStream.srcObject = null;
      livingCard.classList.remove("is-streaming");
      modalViewArea.classList.remove("is-streaming");
    }
  }

  btnToggleCamFeed.addEventListener("click", () => {
    if (globalCamStream) {
      stopLivingCamera();
    } else {
      startLivingCamera();
    }
  });

  function renderAllCardsZones() {
    const savedZones = JSON.parse(localStorage.getItem("edge_vision_zones") || "{}");
    document.querySelectorAll(".cam-card").forEach(card => {
      const name = card.getAttribute("data-name");
      const svg = card.querySelector(".cam-card-svg");
      if (!svg) return;
      svg.innerHTML = "";

      const zoneList = savedZones[name];
      if (zoneList && Array.isArray(zoneList) && zoneList.length > 0) {
        const latestZone = zoneList[zoneList.length - 1];
        if (latestZone.pointsPercent && latestZone.pointsPercent.length >= 3) {
          const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          poly.setAttribute("points", latestZone.pointsPercent.map(p => `${p.x},${p.y}`).join(" "));
          
          const isOrange = latestZone.level === "2";
          poly.setAttribute("fill", isOrange ? "rgba(249, 115, 22, 0.35)" : "rgba(245, 158, 11, 0.35)");
          poly.setAttribute("stroke", isOrange ? "#f97316" : "#f59e0b");
          poly.setAttribute("stroke-width", "1.5");
          svg.appendChild(poly);
        }
      }
    });
  }

  let currentSelectedCam = "客廳";
  const modal = document.getElementById("camModal");
  const modalName = document.getElementById("modalCamName");
  const modalStatus = document.getElementById("modalCamStatus");
  const modalSvg = document.getElementById("modalSvg");
  const closeBtn = document.getElementById("modalCloseBtn");
  const btnGoToConfig = document.getElementById("btnGoToConfig");

  document.querySelectorAll(".cam-card").forEach(card => {
    card.addEventListener("click", () => {
      currentSelectedCam = card.getAttribute("data-name");
      const status = card.getAttribute("data-status");
      
      modalName.textContent = currentSelectedCam;
      modalStatus.textContent = "狀態：" + status;

      // 若點選客廳且相機處於串流狀態
      if (currentSelectedCam === "客廳" && globalCamStream) {
        modalVideoStream.srcObject = globalCamStream;
        modalViewArea.classList.add("is-streaming");
      } else {
        modalViewArea.classList.remove("is-streaming");
      }

      modalSvg.innerHTML = "";
      const savedZones = JSON.parse(localStorage.getItem("edge_vision_zones") || "{}");
      const zoneList = savedZones[currentSelectedCam];
      if (zoneList && Array.isArray(zoneList) && zoneList.length > 0) {
        const latestZone = zoneList[zoneList.length - 1];
        if (latestZone.pointsPercent && latestZone.pointsPercent.length >= 3) {
          const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          poly.setAttribute("points", latestZone.pointsPercent.map(p => `${p.x},${p.y}`).join(" "));
          const isOrange = latestZone.level === "2";
          poly.setAttribute("fill", isOrange ? "rgba(249, 115, 22, 0.35)" : "rgba(245, 158, 11, 0.35)");
          poly.setAttribute("stroke", isOrange ? "#f97316" : "#f59e0b");
          poly.setAttribute("stroke-width", "1.5");
          modalSvg.appendChild(poly);
        }
      }

      modal.classList.add("open");
    });
  });

  btnGoToConfig.addEventListener("click", () => {
    window.location.href = `危險區域入侵越界警報.html?cam=${encodeURIComponent(currentSelectedCam)}`;
  });

  closeBtn.addEventListener("click", () => modal.classList.remove("open"));
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });


  window.addEventListener("pageshow", () => {
    renderAllCardsZones();
    startLivingCamera();
  });

  document.addEventListener("DOMContentLoaded", () => {
    renderAllCardsZones();
    startLivingCamera();
  });
</script>
</body>
</html>
